<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker stopped – IO PM Tracker</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--ink2:#5b6474;--line:#dfe3ea}
  @media (prefers-color-scheme: dark){:root{--bg:#14171d;--card:#1c2028;--ink:#e8ebf1;--ink2:#9aa3b2;--line:#2c323d}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 8px;color:var(--ink2)}
</style></head>
<body>
<div class="card">
  <h1>The tracker has stopped</h1>
  <p>Everything you saved is kept. You can close this tab.</p>
  <p>To open it again, use the <strong>IO PM Tracker</strong> shortcut on your desktop or <strong>start.bat</strong>.</p>
</div>
</body></html>
