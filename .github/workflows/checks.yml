# Runs on every push and pull request: Ruff (linting) and the full test suite.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check . --output-format github

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]             # what the Render demo runs (3.9 is no longer offered by GitHub)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Check no database change is missing a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Run the tests
        run: python manage.py test tracker
