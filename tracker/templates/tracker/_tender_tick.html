{# Tick box for the "Go to tender" milestone. Needs: e (Milestone), next (where to come back to) #}
{% if e.actual or not e.awarded %}
<form method="post" action="/projects/{{ e.project.pk }}/tender/" class="tender-tick">{% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% if e.actual %}
    <button class="tick on" name="action" value="undo" title="Tender issued {{ e.actual }}. Click to undo" aria-pressed="true">
      <span class="box">✓</span>Tendered</button>
  {% else %}
    <button class="tick" name="action" value="done" title="Mark tender as issued" aria-pressed="false"
            data-tender-confirm="{{ e.project.io_number }} · {{ e.project.title|truncatechars:60 }}"
            data-deadline="{{ e.forecast|date:'Y-m-d' }}" data-min="{{ e.design_end|date:'Y-m-d' }}">
      <span class="box"></span>Mark tendered</button>
  {% endif %}
</form>
{% else %}
<span class="tick on" style="cursor:default" title="Construction was awarded {{ e.awarded }}, so the tender has happened. Enter its exact date under actual dates if you have it.">
  <span class="box">✓</span>Awarded {{ e.awarded }}</span>
{% endif %}
