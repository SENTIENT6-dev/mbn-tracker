<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – MBN Tracker</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--ink2:#5b6474;--line:#dfe3ea;--acc:#2a78d6;--crit:#b42318;--critbg:#fdecea}
  @media (prefers-color-scheme: dark){:root{--bg:#14171d;--card:#1c2028;--ink:#e8ebf1;--ink2:#9aa3b2;--line:#2c323d;--acc:#5b9cf0;--crit:#f97066;--critbg:#3a1d1b}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
  .card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
  h1{font-size:20px;margin:0 0 4px}
  p{color:var(--ink2);margin:0 0 18px;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  input:focus{outline:2px solid var(--acc);outline-offset:1px}
  button{margin-top:14px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .err{background:var(--critbg);color:var(--crit);padding:8px 10px;border-radius:8px;font-size:13.5px;margin-bottom:12px}
</style></head>
<body>
  <form method="post" class="card">{% csrf_token %}
    <h1>MBN Tracker</h1>
    <p>Enter the password to continue.</p>
    {% if error %}<div class="err" role="alert">That password isn't right.</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="pw">Password</label>
    <input id="pw" type="password" name="password" autocomplete="current-password" autofocus required>
    <button>Open tracker</button>
  </form>
</body></html>
