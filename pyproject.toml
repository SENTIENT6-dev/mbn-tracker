# Linting with Ruff:  .venv\Scripts\ruff check .        (add --fix to fix what it can)
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tracker/migrations", "staticfiles", "backups"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (unused imports, undefined names...), I import order,
# B bugbear (likely bugs), UP pyupgrade, DJ Django checks, C4 comprehensions, SIM simplifications
select = ["E", "W", "F", "I", "B", "UP", "DJ", "C4", "SIM"]
ignore = [
    "SIM108",  # ternary instead of if/else: not always clearer
    "UP038",   # isinstance(x, A | B): deprecated by Ruff itself; tuples are fine
]

[tool.ruff.lint.per-file-ignores]
"tracker/tests.py" = ["E501"]          # long assertion lines are easier to read whole

[tool.ruff.lint.isort]
known-first-party = ["tracker", "mbn_site"]
